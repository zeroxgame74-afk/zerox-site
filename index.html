<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Zerox Channel</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #B61C1C;
  color: white;
}

/* لوگو */
.logo {
  text-align: center;
  padding: 30px;
  font-size: 40px;
  font-weight: bold;
}

/* کانتینر کارت‌ها */
.container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}

/* کارت‌ها */
.card {
  width: 250px;
  height: 150px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  padding: 15px;
  cursor: pointer;
  transition: 0.3s;
  border: 1px solid rgba(255,255,255,0.2);
}

/* افکت کلیک / انتخاب */
.card:active {
  transform: scale(0.95);
}

.card:hover {
  box-shadow: 0 0 20px white;
}

/* عنوان داخل کارت */
.card h3 {
  margin: 0;
}
</style>
</head>

<body>

<div class="logo">ZEROX</div>

<div class="container">

  <div class="card">
    <h3>Videos</h3>
    <p>ویدیوهای جدید</p>
  </div>

  <div class="card">
    <h3>Stories</h3>
    <p>داستان‌های بازی</p>
  </div>

  <div class="card">
    <h3>Highlights</h3>
    <p>بهترین لحظات</p>
  </div>

</div>

</body>
</html>
