<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerox Gaming</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#111;
color:white;
}

/* هدر */
header{
background:linear-gradient(135deg,#8f1111,#d61f1f);
padding:40px 20px;
text-align:center;
}

/* لوگو */
.logo img{
width:280px;
max-width:90%;
display:block;
margin:auto;
}

/* شعار */
.slogan{
font-size:22px;
margin-top:15px;
}

/* باکس شیشه‌ای منو */
.glass-menu{
width:90%;
max-width:900px;
margin:25px auto 0;
padding:15px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.15);

border-radius:20px;
}

.glass-menu ul{
list-style:none;
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

.glass-menu a{
color:white;
text-decoration:none;
font-size:18px;
transition:.3s;
}

.glass-menu a:hover{
color:#ff5555;
}

/* بخش اصلی */
.hero{
padding:80px 20px;
text-align:center;
}

.hero h1{
font-size:55px;
color:#ff4b4b;
margin-bottom:15px;
}

.hero p{
font-size:20px;
color:#ddd;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 30px;

background:#b61c1c;

border-radius:12px;

color:white;
text-decoration:none;

transition:.3s;
}

.btn:hover{
background:#ff2d2d;
}

/* سکشن ها */
.section{
padding:60px 20px;
text-align:center;
}

.section h2{
margin-bottom:25px;
font-size:35px;
}

/* کارت ها */
.card{
background:#1b1b1b;

max-width:550px;

margin:15px auto;

padding:25px;

border-radius:18px;

border:1px solid #2d2d2d;
}

.card:hover{
transform:translateY(-3px);
transition:.3s;
}

/* فوتر */
footer{
margin-top:40px;
padding:25px;
background:black;
text-align:center;
}

</style></head><body><header><div class="logo">
<img src="https://cdn.imgurl.ir/uploads/s547003_Zerox.png">
</div><div class="slogan">
اینجا کانال خفن زروکسه!
</div><nav class="glass-menu">
<ul>
<li><a href="#">خانه</a></li>
<li><a href="#">ویدیوها</a></li>
<li><a href="#">داستان بازی‌ها</a></li>
<li><a href="#">فروش اکانت</a></li>
<li><a href="#">درباره ما</a></li>
</ul>
</nav></header><section class="hero"><h1>به دنیای Zerox خوش اومدی!</h1><p>
داستان بازی‌ها، گیم‌پلی و کلی محتوای خفن گیمینگ
</p><a class="btn" href="#">
ورود به کانال
</a></section><section class="section"><h2>آخرین ویدیوها</h2><div class="card">
داستان بازی BioShock
</div><div class="card">
داستان بازی Outlast
</div><div class="card">
معرفی Astro Bot
</div></section><footer>© Zerox Gaming

</footer></body>
</html>
