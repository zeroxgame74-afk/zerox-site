<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerox Site</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    overflow-x:hidden;
    background: linear-gradient(-45deg, #B61C1C, #1a1a1a, #B61C1C, #000);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    color:white;
}

/* انیمیشن بکگراند */
@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

header{
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-size:50px;
    letter-spacing:2px;
}

header p{
    opacity:0.8;
}

/* دکمه */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#B61C1C;
    color:white;
    border-radius:12px;
    text-decoration:none;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.1);
    background:#ff2a2a;
}

/* کارت‌ها */
.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:40px;
}

.card{
    width:250px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    background:rgba(255,255,255,0.15);
}

footer{
    text-align:center;
    padding:20px;
    opacity:0.6;
}
</style>

</head>

<body>

<header>
    <h1>Zerox</h1>
    <p>Welcome to my gaming & creative world</p>
    <a href="#" class="btn">Enter Site</a>
</header>

<div class="container">
    <div class="card">
        <h3>Gaming</h3>
        <p>Best clips, edits and highlights.</p>
    </div>

    <div class="card">
        <h3>Editing</h3>
        <p>After Effects cinematic edits.</p>
    </div>

    <div class="card">
        <h3>Projects</h3>
        <p>Creative and futuristic designs.</p>
    </div>
</div>

<footer>
    © 2026 Zerox. All rights reserved.
</footer>

</body>
</html>
