<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerox</title>

<style>
@font-face {
    font-family: 'ZeroxTitle';
    src: url('https://cdn.imgurl.ir/uploads/a170504_MAHDIPSD____1_fat.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#B61C1C;
    font-family: Arial, sans-serif;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    padding-top:50px;
}

/* لوگو */
.logo{
    width:320px;
    max-width:90%;
    filter: drop-shadow(0 0 12px rgba(0,0,0,0.6));
}

/* عنوان */
.title{
    font-family:'ZeroxTitle';
    font-size:70px;
    margin-top:10px;
    -webkit-text-stroke: 2px black;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

/* باکس شیشه‌ای */
.glass-box{
    margin-top:30px;
    width:90%;
    max-width:420px;
    padding:20px;
    border-radius:18px;

    background: rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(8px);

    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

/* عنوان داخل باکس */
.glass-box h2{
    font-family:'ZeroxTitle';
    font-size:30px;
    margin-bottom:15px;
    text-shadow:2px 2px 5px black;
}

/* آیتم‌ها */
.item{
    display:flex;
    align-items:center;
    gap:10px;
    margin:12px 0;
    font-size:16px;
    text-shadow:1px 1px 3px black;
}

/* آیکون */
.icon{
    font-size:20px;
}
</style>

</head>

<body>

<!-- لوگو -->
<img class="logo" src="https://cdn.imgurl.ir/uploads/s547003_Zerox.png" alt="Zerox Logo">

<!-- عنوان -->
<div class="title">زروکس</div>

<!-- باکس شیشه‌ای -->
<div class="glass-box">

    <h2>📖 داستان بازی</h2>

    <div class="item">
        <div class="icon">🎮</div>
        <div>شروع ماجراجویی در دنیای گیمینگ</div>
    </div>

    <div class="item">
        <div class="icon">⚔️</div>
        <div>نبردهای هیجان‌انگیز و لحظات نفس‌گیر</div>
    </div>

    <div class="item">
        <div class="icon">🔥</div>
        <div>ادیت‌های سینمایی و حرفه‌ای</div>
    </div>

</div>

</body>
</html>
