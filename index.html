<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerox</title>

<style>
@font-face {
    font-family: 'ZeroxTitle';
    src: url('https://up.20script.ir/do.php?filename=7616-FONT-DORAN-resane-amir-amlmomenin-110.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(-45deg, #B61C1C, #000, #1a1a1a, #B61C1C);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* هدر */
header{
    text-align:center;
    padding:50px 20px;
}

header img{
    width:280px;   /* لوگو بزرگ‌تر شد */
    max-width:90%;
    filter: drop-shadow(0 0 15px rgba(0,0,0,0.6));
    margin-bottom:10px;
}

header h1{
    font-family: 'ZeroxTitle';
    font-size:70px;
    letter-spacing:3px;
    margin-top:10px;
}

header p{
    opacity:0.8;
    font-size:18px;
}

/* دکمه */
.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 28px;
    background:#B61C1C;
    color:white;
    border-radius:12px;
    text-decoration:none;
    transition:0.3s;
    font-size:16px;
}

.btn:hover{
    transform:scale(1.1);
    background:#ff2a2a;
}

/* کارت‌ها */
.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:40px;
}

.card{
    width:260px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
}

.card h3{
    font-family:'ZeroxTitle';
}

.card:hover{
    transform:translateY(-10px);
    background:rgba(255,255,255,0.15);
}

footer{
    text-align:center;
    padding:20px;
    opacity:0.6;
}
</style>

</head>

<body>

<header>
    <img src="https://cdn.imgurl.ir/uploads/s547003_Zerox.png" alt="Zerox Logo">
    <h1>Zerox</h1>
    <p>Gaming • Editing • Creativity</p>
    <a class="btn" href="#">Enter Site</a>
</header>

<div class="container">

    <div class="card">
        <h3>Gaming</h3>
        <p>Best gameplay clips and highlights.</p>
    </div>

    <div class="card">
        <h3>Editing</h3>
        <p>Cinematic After Effects projects.</p>
    </div>

    <div class="card">
        <h3>Projects</h3>
        <p>Creative UI & design works.</p>
    </div>

</div>

<footer>
    © 2026 Zerox - All rights reserved
</footer>

</body>
</html>
