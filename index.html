<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Zerox</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* هدر */
header {
  background: #B61C1C;
  padding: 20px;
  text-align: center;
}

.logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: white;
  display: inline-block;
}

/* عنوان */
h1 {
  margin: 10px 0 0;
}

/* کانتینر کارت‌ها */
.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  padding: 30px;
  gap: 20px;
}

/* کارت‌ها */
.card {
  width: 220px;
  height: 140px;
  background: #1a1a1a;
  border: 2px solid #333;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s;
  position: relative;
}

/* هاور */
.card:hover {
  transform: scale(1.05);
  border-color: #B61C1C;
}

/* افکت کلیک (گلو) */
.card.active {
  box-shadow: 0 0 25px #B61C1C, 0 0 50px #B61C1C;
  border-color: #B61C1C;
}
</style>
</head>

<body>

<header>
  <div class="logo"></div>
  <h1>Zerox Channel</h1>
</header>

<div class="container">

  <div class="card">داستان‌ها</div>
  <div class="card">ویدیوها</div>
  <div class="card">گیم‌پلی</div>
  <div class="card">آرشیو</div>

</div>

<script>
const cards = document.querySelectorAll(".card");

cards.forEach(card => {
  card.addEventListener("click", () => {

    // حذف حالت قبلی
    cards.forEach(c => c.classList.remove("active"));

    // اضافه کردن حالت جدید
    card.classList.add("active");
  });
});
</script>

</body>
</html>
