<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zerox Site</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Vazirmatn', sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:#000;
}

/* BACKGROUND */
.bg{
  position:absolute;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 20% 20%, #B61C1C, transparent 35%),
    radial-gradient(circle at 80% 30%, #ff2a2a, transparent 40%),
    radial-gradient(circle at 50% 80%, #7a0f0f, transparent 45%),
    radial-gradient(circle at 70% 60%, #B61C1C, transparent 50%),
    linear-gradient(120deg, #0a0a0a, #1a0000);

  animation: moveBg 7s ease-in-out infinite;
  filter: blur(70px);
  transform: scale(1.3);
}

@keyframes moveBg{
  0%{
    transform: translate(0,0) scale(1.3);
  }
  50%{
    transform: translate(-10%,-8%) scale(1.4);
  }
  100%{
    transform: translate(0,0) scale(1.3);
  }
}

/* MAIN */
.container{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  flex-direction:column;
}

/* GLASS CARD */
.card{
  width:340px;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  backdrop-filter:blur(12px);
  box-shadow:0 0 40px rgba(182,28,28,0.4);
}

/* LOGO */
.logo{
  width:110px;
  height:110px;
  border-radius:50%;
  border:3px solid #B61C1C;
  margin-bottom:15px;
  object-fit:cover;
}

/* TEXT */
h1{
  font-size:24px;
  margin-bottom:8px;
}

p{
  font-size:14px;
  opacity:0.8;
}

/* BUTTON */
.btn{
  margin-top:15px;
  display:inline-block;
  padding:10px 18px;
  background:#B61C1C;
  color:white;
  border-radius:12px;
  text-decoration:none;
  transition:0.3s;
  font-weight:500;
}

.btn:hover{
  background:#ff2a2a;
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <div class="card">

    <!-- عکس خودت یا لوگو -->
    <img class="logo" src="https://via.placeholder.com/150" alt="logo">

    <!-- اسم سایت -->
    <h1>Zerox Game</h1>

    <!-- متن -->
    <p>به سایت رسمی من خوش آمدید</p>

    <!-- دکمه -->
    <a class="btn" href="#">ورود به سایت</a>

  </div>
</div>

</body>
</html>
