<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerox Gaming</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#111;
color:white;
}

header{
background:linear-gradient(90deg,#b61c1c,#ff2d2d);
padding:30px;
text-align:center;
}

.logo{
font-size:60px;
font-weight:bold;
}

.slogan{
font-size:22px;
margin-top:10px;
}

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:50px;
color:#ff3c3c;
}

.hero p{
margin-top:20px;
font-size:20px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 30px;
background:#b61c1c;
color:white;
text-decoration:none;
border-radius:10px;
transition:0.3s;
}

.btn:hover{
background:#ff2d2d;
}

.section{
padding:50px 20px;
text-align:center;
}

.card{
background:#1c1c1c;
padding:20px;
border-radius:15px;
margin:15px auto;
max-width:500px;
}

footer{
background:#000;
text-align:center;
padding:20px;
margin-top:50px;
}
</style>
</head>

<body>

<header>
<div class="logo">Z</div>
<div class="slogan">اینجا کانال خفن زروکسه!</div>
</header>

<section class="hero">
<h1>به دنیای Zerox خوش اومدی!</h1>
<p>داستان بازی‌ها، گیم‌پلی و کلی محتوای خفن گیمینگ</p>

<a class="btn" href="#">کانال یوتیوب</a>
</section>

<section class="section">
<h2>آخرین ویدیوها</h2>

<div class="card">
داستان بازی BioShock
</div>

<div class="card">
داستان بازی Outlast
</div>

<div class="card">
معرفی Astro Bot
</div>
</section>

<footer>
© Zerox Gaming
</footer>

</body>
</html>
