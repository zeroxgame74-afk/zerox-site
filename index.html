<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زروکس</title>

<style>
/* فونت جدید */
@font-face {
    font-family: 'ZeroxTitle';
    src: url('https://cdn.imgurl.ir/uploads/a170504_MAHDIPSD____1_fat.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#B61C1C;
    color:white;
}

/* عنوان‌ها با فونت جدید + استروک */
h1, h2, h3{
    font-family:'ZeroxTitle';
    -webkit-text-stroke: 2px black;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
}

/* هدر */
header{
    text-align:center;
    padding:50px 20px;
}

header img{
    width:320px;
    max-width:90%;
    filter: drop-shadow(0 0 12px rgba(0,0,0,0.6));
}

header h1{
    font-size:80px;
    margin-top:10px;
}

header p{
    font-size:18px;
    margin-top:8px;
    text-shadow: 2px 2px 4px black;
}

/* دکمه */
.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 30px;
    background:black;
    color:white;
    border-radius:12px;
    text-decoration:none;
    font-size:16px;
    transition:0.3s;
    border:2px solid white;
}

.btn:hover{
    transform:scale(1.05);
    background:white;
    color:black;
}

/* کارت‌ها */
.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:40px;
}

.card{
    width:270px;
    padding:20px;
    border-radius:15px;
    background:rgba(0,0,0,0.25);
    border:2px solid rgba(0,0,0,0.4);
    text-align:right;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    background:rgba(0,0,0,0.35);
}

.card p{
    text-shadow: 1px 1px 3px black;
}

/* فوتر */
footer{
    text-align:center;
    padding:20px;
    font-size:14px;
    text-shadow: 2px 2px 4px black;
}
</style>

</head>

<body>

<header>
    <img src="https://cdn.imgurl.ir/uploads/s547003_Zerox.png" alt="لوگوی زروکس">
    <h1>زروکس</h1>
    <p>گیمینگ • ادیت • خلاقیت</p>
    <a class="btn" href="#">ورود به سایت</a>
</header>

<div class="container">

    <div class="card">
        <h3>گیمینگ</h3>
        <p>کلیپ‌های حرفه‌ای از بهترین لحظات بازی.</p>
    </div>

    <div class="card">
        <h3>ادیت</h3>
        <p>ویدیوهای سینمایی و افترافکت خفن.</p>
    </div>

    <div class="card">
        <h3>پروژه‌ها</h3>
        <p>طراحی‌های خاص و گیمینگ‌استایل.</p>
    </div>

</div>

<footer>
    © 2026 زروکس - تمامی حقوق محفوظ است
</footer>

</body>
</html>
