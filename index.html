<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZEROX | GAME</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Vazirmatn',sans-serif;font-weight:700;background-color:#B61C1C;color:#1a1a1a;min-height:100vh;}
        .header{text-align:center;padding:20px 20px 10px;}
        .logo-raw{width:auto;height:560px;object-fit:contain;margin-bottom:20px;}
        .menu{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin-top:10px;}
        .menu a{color:#fff;text-decoration:none;font-weight:800;font-size:17px;transition:0.2s;padding:5px 0;display:inline-flex;align-items:center;gap:8px;}
        .menu a i{font-size:18px;}
        .menu a:hover{border-bottom:2px solid #fff;transform:translateY(-2px);}
        .slider-container{max-width:1080px;margin:20px auto;padding:0 25px;position:relative;}
        .slider{position:relative;width:100%;border-radius:24px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.2);}
        .slides{display:flex;transition:transform 0.5s ease-in-out;}
        .slide{min-width:100%;}
        .slide img{width:100%;height:auto;display:block;}
        .dots{text-align:center;padding:15px 0 5px;}
        .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.5);margin:0 6px;cursor:pointer;transition:0.2s;}
        .dot.active{background:#fff;transform:scale(1.2);}
        .container{max-width:1300px;margin:40px auto;padding:0 25px;}
        .section-title{font-size:1.8rem;font-weight:900;margin-bottom:25px;border-right:4px solid #fff;padding-right:15px;display:flex;align-items:center;gap:10px;color:#fff;}
        .cards-grid,.news-grid,.videos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;margin-bottom:40px;}
        .thumbnail-card,.news-card,.video-card{background:#fff;border-radius:24px;overflow:hidden;transition:0.3s;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,0.1);color:#1a1a1a;}
        .thumbnail-card:hover,.news-card:hover,.video-card:hover{transform:translateY(-8px);box-shadow:0 20px 30px -8px rgba(0,0,0,0.3);}
        .thumbnail-img,.news-img,.video-thumb{width:100%;height:200px;object-fit:cover;display:block;border-bottom:1px solid #eee;}
        .card-content,.news-content,.video-info{padding:20px;text-align:center;}
        .card-content h3,.news-content h3,.video-info h3{font-size:1.4rem;margin-bottom:10px;font-weight:900;color:#B61C1C;}
        .card-content p,.news-content p,.video-info p{font-size:0.9rem;color:#444;margin-bottom:15px;line-height:1.5;}
        .btn-card{background:#B61C1C;border:none;padding:8px 25px;border-radius:40px;color:#fff;font-weight:800;cursor:pointer;transition:0.2s;font-size:14px;}
        .btn-card:hover{background:#8a1010;transform:scale(1.02);}
        .news-date{font-size:0.75rem;color:#777;margin-top:10px;}
        .video-badge{position:absolute;top:15px;right:15px;background:#B61C1C;color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900;}
        .video-card{position:relative;}
        .featured{background:#fff;border-radius:24px;padding:30px;text-align:center;color:#1a1a1a;margin-top:20px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
        .featured h2{color:#B61C1C;}
        .footer{text-align:center;padding:35px;margin-top:50px;border-top:1px solid rgba(255,255,255,0.2);color:#fff;}
        @media (max-width:700px){.logo-raw{height:280px;}.menu a{font-size:13px;gap:6px;}}
    </style>
</head>
<body>
    <header class="header">
        <img class="logo-raw" src="https://cdn.imgurl.ir/uploads/s547003_Zerox.png" alt="Zerox Logo">
        <div class="menu">
            <a onclick="showPage('home')"><i class="fas fa-home"></i> خانه</a>
            <a onclick="showPage('stories')"><i class="fas fa-book-open"></i> داستان‌ها</a>
            <a onclick="showPage('videos')"><i class="fas fa-video"></i> ویدیوها</a>
            <a onclick="showPage('news')"><i class="fas fa-newspaper"></i> اخبار</a>
            <a onclick="showPage('about')"><i class="fas fa-info-circle"></i> درباره ما</a>
        </div>
    </header>

    <!-- اسلایدر با عکس‌های جدید از سرور پایدار -->
    <div class="slider-container">
        <div class="slider">
            <div class="slides" id="slides">
                <div class="slide"><img src="https://s6.iranv.ir/images/2025/06/05/InShot_20260605_195526606.jpg" alt="اسلاید ۱"></div>
                <div class="slide"><img src="https://s6.iranv.ir/images/2025/06/05/IMG_20260602_122511_961.png" alt="اسلاید ۲"></div>
                <div class="slide"><img src="https://s6.iranv.ir/images/2025/06/05/InShot_20260605_200640757.jpg" alt="اسلاید ۳"></div>
            </div>
        </div>
        <div class="dots" id="dots"></div>
    </div>

    <div class="container" id="contentContainer">
        <div id="homePage">...</div>
        <div id="storiesPage" style="display:none;">...</div>
        <div id="videosPage" style="display:none;">...</div>
        <div id="newsPage" style="display:none;">...</div>
        <div id="aboutPage" style="display:none;">...</div>
    </div>

    <footer class="footer">
        <p>© 2025 ZEROX | GAME — هر بازی یک حماسه</p>
    </footer>

    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');

        function showSlides() {
            const slidesContainer = document.getElementById('slides');
            slidesContainer.style.transform = `translateX(-${slideIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === slideIndex);
            });
        }

        function changeSlide(n) {
            slideIndex += n;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (slideIndex < 0) slideIndex = slides.length - 1;
            showSlides();
        }

        if (slides.length > 0) {
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                dot.onclick = () => { slideIndex = i; showSlides(); };
                dotsContainer.appendChild(dot);
            });
            showSlides();
            setInterval(() => changeSlide(1), 5000);
        }

        function showPage(page) {
            const pages = ['homePage', 'storiesPage', 'videosPage', 'newsPage', 'aboutPage'];
            pages.forEach(p => document.getElementById(p).style.display = 'none');
            if (page === 'home') document.getElementById('homePage').style.display = 'block';
            else if (page === 'stories') document.getElementById('storiesPage').style.display = 'block';
            else if (page === 'videos') document.getElementById('videosPage').style.display = 'block';
            else if (page === 'news') { document.getElementById('newsPage').style.display = 'block'; loadNews(); }
            else if (page === 'about') document.getElementById('aboutPage').style.display = 'block';
        }

        function loadNews() {
            const newsData = [
                { title: "رونمایی از بسته الحاقی بزرگ God of War Ragnarök", summary: "سونی رسما از بسته الحاقی جدید خدای جنگ رونمایی کرد.", image: "https://cdn.imgurl.ir/uploads/r97029_Negar_1780663640432.jpg", date: "۱۴۰۳/۱۲/۲۰" },
                { title: "تاریخ انتشار GTA 6 مشخص شد", summary: "شرکت راکستار گیمز اعلام کرد که GTA 6 در پاییز ۲۰۲۵ منتشر می‌شود.", image: "https://cdn.imgurl.ir/uploads/r97029_Negar_1780663640432.jpg", date: "۱۴۰۳/۱۲/۱۸" }
            ];
            const newsGrid = document.getElementById('newsGrid');
            if (!newsGrid) return;
            if (newsData.length === 0) { newsGrid.innerHTML = '<div style="text-align:center;padding:50px;">هیچ خبری یافت نشد.</div>'; return; }
            let html = '';
            for (let news of newsData) {
                html += `<div class="news-card"><img class="news-img" src="${news.image}" alt="${news.title}"><div class="news-content"><h3>${news.title}</h3><p>${news.summary}</p><div class="news-date">📅 ${news.date}</div></div></div>`;
            }
            newsGrid.innerHTML = html;
        }

        // مقداردهی اولیه محتوای صفحات
        document.getElementById('homePage').innerHTML = `... (محتوای قبلی) ...`;
        document.getElementById('storiesPage').innerHTML = `... (محتوای قبلی) ...`;
        document.getElementById('videosPage').innerHTML = `... (محتوای قبلی) ...`;
        document.getElementById('newsPage').innerHTML = `<div class="section-title"><i class="fas fa-newspaper"></i> آخرین اخبار بازی</div><div class="news-grid" id="newsGrid"></div>`;
        document.getElementById('aboutPage').innerHTML = `<div class="featured"><h2>درباره ZEROX | GAME</h2><p>سایت تخصصی داستان، معرفی و اخبار بازی‌ها</p></div>`;
    </script>
</body>
</html>
