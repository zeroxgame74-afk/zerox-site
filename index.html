<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zerox Site</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Vazirmatn', sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:#0a0a0a;
}

/* animated background */
.bg{
  position:absolute;
  width:200%;
  height:200%;
  background: linear-gradient(45deg, #B61C1C, #111, #222, #B61C1C);
  animation: moveBg 10s linear infinite;
  filter: blur(60px);
}

@keyframes moveBg{
  0%{transform:translate(0,0);}
  50%{transform:translate(-25%,-25%);}
  100%{transform:translate(0,0);}
}

.container{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
  text-align:center;
  color:white;
}

.glass{
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  padding:30px;
  border-radius:20px;
  width:320px;
  box-shadow:0 0 30px rgba(182,28,28,0.4);
}

.logo{
  width:120px;
  height:120px;
  border-radius:50%;
  margin-bottom:15px;
  border:3px solid #B61C1C;
  object-fit:cover;
}

h1{
  margin-bottom:10px;
  font-size:24px;
}

p{
  font-size:14px;
  opacity:0.8;
}

.btn{
  margin-top:15px;
  display:inline-block;
  padding:10px 20px;
  background:#B61C1C;
  color:white;
  border-radius:12px;
  text-decoration:none;
  transition:0.3s;
}

.btn:hover{
  background:#ff2a2a;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <div class="glass">
    <img class="logo" src="https://via.placeholder.com/150" alt="logo">
    <h1>Zerox Channel</h1>
    <p>به سایت رسمی من خوش آمدید</p>
    <a class="btn" href="#">ورود</a>
  </div>
</div>

</body>
</html>
