<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerox Channel</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Vazirmatn', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f0f0f;
  overflow: hidden;
}

/* Animated background */
.bg {
  position: absolute;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, #B61C1C, #111, #B61C1C, #000);
  animation: moveBg 10s linear infinite;
  z-index: -2;
}

@keyframes moveBg {
  0% { transform: translate(0,0); }
  50% { transform: translate(-25%, -25%); }
  100% { transform: translate(0,0); }
}

/* Glass container */
.glass {
  width: 350px;
  padding: 25px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.2);
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

/* Image */
.glass img {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #B61C1C;
  margin-bottom: 15px;
}

/* Title */
h1 {
  color: #fff;
  margin-bottom: 10px;
  font-weight: 700;
}

p {
  color: #ddd;
  font-size: 14px;
}

/* Glow box effect */
.glow-box {
  margin-top: 15px;
  padding: 10px;
  border-radius: 12px;
  background: rgba(182,28,28,0.2);
  border: 1px solid rgba(182,28,28,0.5);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="glass">
  <img src="channel.jpg" alt="channel">
  <h1>Zerox Channel</h1>
  <p>Welcome to my gaming world</p>

  <div class="glow-box">
    خیلی خفن 😎🔥
  </div>
</div>

</body>
</html>
