<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>فروشگاه خفن | مدرن ترین محصولات</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font Vazir -->
    <link href="https://fonts.googleapis.com/css2?family=Vazir:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* اسکرول نرم */
        html {
            scroll-behavior: smooth;
        }

        /* استایل اسکرول بار */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        /* هدر */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 0;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #334155;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #3b82f6;
        }

        .cart-icon {
            position: relative;
            font-size: 24px;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -12px;
            background: #ef4444;
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* بنر شگفت‌انگیز */
        .hero {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border-radius: 30px;
            margin: 30px 20px;
            padding: 60px 40px;
            color: white;
            text-align: center;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.2);
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            font-size: 2rem;
            font-weight: bold;
        }

        .timer div {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        /* بخش محصولات */
        .products-section {
            padding: 50px 0;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            border-right: 5px solid #3b82f6;
            padding-right: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.2);
        }

        .product-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            transition: 0.5s;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-price {
            color: #3b82f6;
            font-size: 1.4rem;
            font-weight: 800;
            margin: 12px 0;
        }

        .old-price {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-right: 10px;
        }

        .add-to-cart {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-family: 'Vazir';
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-to-cart:hover {
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            transform: scale(0.98);
        }

        /* سبد خرید side cart */
        .side-cart {
            position: fixed;
            top: 0;
            left: -400px;
            width: 380px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            transition: 0.4s;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .side-cart.open {
            left: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .cart-items {
            flex: 1;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
        }

        .cart-item-details {
            flex: 1;
        }

        .remove-item {
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
        }

        .cart-total {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 20px 0;
            text-align: center;
        }

        .checkout-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 1000;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        footer {
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            .timer {
                font-size: 1rem;
                gap: 10px;
            }
            .side-cart {
                width: 100%;
                left: -100%;
            }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<div class="side-cart" id="sideCart">
    <div class="cart-header">
        <h3>سبد خرید <i class="fas fa-shopping-bag"></i></h3>
        <i class="fas fa-times" id="closeCart" style="font-size: 24px; cursor: pointer;"></i>
    </div>
    <div class="cart-items" id="cartItems">
        <p style="text-align: center;">سبد خرید خالی است</p>
    </div>
    <div class="cart-total" id="cartTotal">جمع کل: 0 تومان</div>
    <button class="checkout-btn" id="checkoutBtn">پرداخت نهایی</button>
</div>

<header class="header">
    <div class="container">
        <div class="nav">
            <div class="logo">🔥 شاپِ خفن</div>
            <div class="nav-links">
                <a href="#">خانه</a>
                <a href="#products">محصولات</a>
                <a href="#">تخفیف‌ها</a>
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h1>تخفیف شگفت‌انگیز تابستانه 🔥</h1>
        <p>تا ۵۰٪ تخفیف ویژه + ارسال رایگان</p>
        <div class="timer" id="timer">
            <div><span id="days">00</span> روز</div>
            <div><span id="hours">00</span> ساعت</div>
            <div><span id="minutes">00</span> دقیقه</div>
            <div><span id="seconds">00</span> ثانیه</div>
        </div>
    </div>
</section>

<section id="products" class="products-section">
    <div class="container">
        <h2 class="section-title">✨ محصولات داغ و خفن ✨</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>
</section>

<footer>
    <p>© 2025 شاپِ خفن | همه چی باحال و قانونی</p>
    <p style="margin-top: 10px;"><i class="fas fa-heart" style="color: #ef4444;"></i> پشتیبانی ۲۴ ساعته</p>
</footer>

<script>
    // محصولات خفن
    const products = [
        { id: 1, name: "هدفون بی‌سیم X9", price: 1250000, oldPrice: 2500000, image: "https://picsum.photos/id/1/300/300", discount: 50 },
        { id: 2, name: "کیبورد گیمینگ RGB", price: 1890000, oldPrice: 2700000, image: "https://picsum.photos/id/0/300/300", discount: 30 },
        { id: 3, name: "موس اولترا لایت", price: 890000, oldPrice: 1450000, image: "https://picsum.photos/id/20/300/300", discount: 38 },
        { id: 4, name: "پاوربانک ۲۰۰۰۰ میلی‌آمپر", price: 950000, oldPrice: 1350000, image: "https://picsum.photos/id/26/300/300", discount: 29 },
        { id: 5, name: "ساعت هوشمند اسپرت", price: 2150000, oldPrice: 3490000, image: "https://picsum.photos/id/82/300/300", discount: 38 },
        { id: 6, name: "اسپیکر قابل حمل", price: 1450000, oldPrice: 2200000, image: "https://picsum.photos/id/29/300/300", discount: 34 }
    ];

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function saveCart() {
        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartUI();
        updateCartCount();
    }

    function updateCartCount() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("cartCount").innerText = totalItems;
    }

    function updateCartUI() {
        const cartItemsDiv = document.getElementById("cartItems");
        const cartTotalSpan = document.getElementById("cartTotal");
        if (cart.length === 0) {
            cartItemsDiv.innerHTML = "<p style='text-align: center;'>سبد خرید خالی است 🛒</p>";
            cartTotalSpan.innerText = "جمع کل: 0 تومان";
            return;
        }
        let html = "";
        let total = 0;
        cart.forEach(item => {
            total += item.price * item.quantity;
            html += `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-details">
                        <strong>${item.name}</strong><br>
                        <span>${item.price.toLocaleString()} تومان</span>
                        <div>تعداد: ${item.quantity}</div>
                        <span class="remove-item" data-id="${item.id}"><i class="fas fa-trash-alt"></i> حذف</span>
                    </div>
                </div>
            `;
        });
        cartItemsDiv.innerHTML = html;
        cartTotalSpan.innerText = `جمع کل: ${total.toLocaleString()} تومان`;

        document.querySelectorAll(".remove-item").forEach(el => {
            el.addEventListener("click", (e) => {
                const id = parseInt(el.getAttribute("data-id"));
                cart = cart.filter(item => item.id !== id);
                saveCart();
            });
        });
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        const existItem = cart.find(item => item.id === productId);
        if (existItem) {
            existItem.quantity += 1;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image,
                quantity: 1
            });
        }
        saveCart();
        // انیمیشن کوچک
        const cartIcon = document.getElementById("cartIcon");
        cartIcon.style.transform = "scale(1.1)";
        setTimeout(() => cartIcon.style.transform = "scale(1)", 200);
    }

    function renderProducts() {
        const grid = document.getElementById("productsGrid");
        grid.innerHTML = "";
        products.forEach(prod => {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <img class="product-img" src="${prod.image}" alt="${prod.name}">
                <div class="product-info">
                    <div class="product-title">${prod.name}</div>
                    <div class="product-price">
                        ${prod.price.toLocaleString()} تومان
                        <span class="old-price">${prod.oldPrice.toLocaleString()} تومان</span>
                    </div>
                    <div style="font-size:12px; color:#10b981;">🔥 ${prod.discount}% تخفیف ویژه</div>
                    <button class="add-to-cart" data-id="${prod.id}">
                        <i class="fas fa-cart-plus"></i> افزودن به سبد
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });

        document.querySelectorAll(".add-to-cart").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute("data-id"));
                addToCart(id);
            });
        });
    }

    // Timer countdown (3 روز دیگه)
    function startTimer() {
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 3);
        targetDate.setHours(23, 59, 59, 999);

        function updateTimer() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) {
                document.getElementById("timer").innerHTML = "<div>تخفیف‌ها به پایان رسید 😢</div>";
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (86400000)) / (3600000));
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            document.getElementById("days").innerText = days < 10 ? "0"+days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0"+hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0"+minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0"+seconds : seconds;
        }
        updateTimer();
        setInterval(updateTimer, 1000);
    }

    // side cart events
    const cartIconBtn = document.getElementById("cartIcon");
    const sideCart = document.getElementById("sideCart");
    const overlay = document.getElementById("overlay");
    const closeCart = document.getElementById("closeCart");

    function openCart() {
        sideCart.classList.add("open");
        overlay.classList.add("active");
    }
    function closeCartFunc() {
        sideCart.classList.remove("open");
        overlay.classList.remove("active");
    }
    cartIconBtn.addEventListener("click", openCart);
    closeCart.addEventListener("click", closeCartFunc);
    overlay.addEventListener("click", closeCartFunc);

    document.getElementById("checkoutBtn").addEventListener("click", () => {
        if(cart.length === 0) {
            alert("سبد خرید خالی است! محصولی اضافه کن");
            return;
        }
        alert(`✅ سفارش شما با مبلغ ${document.getElementById("cartTotal").innerText.replace("جمع کل: ", "")} ثبت شد. ممنون از خریدتون!`);
        cart = [];
        saveCart();
        closeCartFunc();
    });

    renderProducts();
    updateCartUI();
    updateCartCount();
    startTimer();
</script>
</body>
</html>
