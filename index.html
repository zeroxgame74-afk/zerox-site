<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerox Premium</title>

<style>
/* فونت اختصاصی */
@font-face {
  font-family: 'Doran';
  src: url("[up.20script.ir](https://reference-url-citation.invalid/0)");
}

/* پایه */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

/* بکگراند متحرک */
.bg {
  position: absolute;
  width: 300%;
  height: 300%;
  background: linear-gradient(45deg, #B61C1C, #000, #1a1a1a, #B61C1C);
  animation: move 12s linear infinite;
  z-index: -2;
}

@keyframes move {
  0% { transform: translate(0,0); }
  50% { transform: translate(-20%, -20%); }
  100% { transform: translate(0,0); }
}

/* کانتینر شیشه‌ای */
.glass {
  width: 380px;
  padding: 25px;
  border-radius: 25px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 0 40px rgba(182,28,28,0.4);
  text-align: center;
}

/* لوگو */
.logo {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 4px solid #B61C1C;
  object-fit: cover;
  margin-bottom: 20px;
  box-shadow: 0 0 25px rgba(182,28,28,0.6);
}

/* عنوان */
h1 {
  font-family: 'Doran';
  color: white;
  font-size: 28px;
  margin-bottom: 10px;
}

/* باکس‌ها */
.box {
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(182,28,28,0.15);
  border: 1px solid rgba(182,28,28,0.4);
  color: #fff;
  font-family: 'Doran';
}

.small {
  font-size: 13px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="glass">

  <img class="logo" src="[cdn.imgurl.ir](https://reference-url-citation.invalid/1)" alt="logo">

  <h1>Zerox Channel</h1>

  <div class="box">باشه عزیزم ممنون</div>
  <div class="box small">خیلی خفن و حرفه‌ای طراحی شد 🔥</div>

</div>

</body>
</html>
